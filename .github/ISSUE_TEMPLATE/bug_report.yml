name: Bug report
description: Something BAS Hub did wrong. Say what happened, in order.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Attach the failure log.** BAS Hub writes a log file for every failure, at the moment it happens. In the app: Settings → Open logs folder. Attach that file to this issue — it carries the full diagnostics and is the single most useful thing you can send.

        Issues are public. Leave out site data, addresses, and credentials.
  - type: input
    id: version
    attributes:
      label: BAS Hub version
      description: In the app, Settings → About shows the version; its Copy version info button copies the full set (suite, modules, OS).
      placeholder: "e.g. 0.9.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the app did — including the exact words of any message it showed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: In order — or "happened once, not reproducible", which is also useful.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: false
